name: SDD Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  sdd-gate:
    name: sdd-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # PyYAML is a hard dependency of the gate: it cannot pretend to have
      # validated YAML when it is absent.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run SDD gate (R4/R7 + baseline)
        run: python3 scripts/ci/sdd-gate.py
